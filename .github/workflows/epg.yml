name: Loca EPG

on:
  schedule:
    # Gunde iki kez: 04:30 ve 16:30 (TR saati)
    - cron: '30 1,13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # GitHub, ACIK depolarda 60 gun hareket olmazsa zamanlanmis is'leri
      # kendiliginden kapatiyor. Her ayin 1'inde ana dala bos bir commit atip
      # depoyu "hareketli" gosteriyoruz. Ucuncu taraf bir action kullanmiyoruz:
      # o depo kapanirsa butun is bizimle birlikte duruyor.
      # Yine de kapanirsa GitHub e-posta atiyor; Actions sekmesindeki
      # "Enable workflow" dugmesi yeter.
      - name: Depoyu canli tut
        continue-on-error: true
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            git config user.name "epg-bot"
            git config user.email "epg-bot@users.noreply.github.com"
            git commit --allow-empty -m "keepalive $(date -u '+%Y-%m-%d')"
            git push origin HEAD:main
          else
            echo "bugun keepalive gunu degil, atlandi"
          fi

      # Bir ulke bugun cekilemezse dunku dosyasi ayakta kalsin.
      - name: Onceki rehberi al
        continue-on-error: true
        run: |
          mkdir -p onceki
          git fetch origin guide --depth 1 || true
          if git rev-parse --verify origin/guide >/dev/null 2>&1; then
            for f in $(git ls-tree --name-only origin/guide); do
              case "$f" in
                *.xml.gz) git show "origin/guide:$f" > "onceki/$f" ;;
              esac
            done
          fi
          ls -lh onceki 2>/dev/null || echo "onceki rehber yok"

      # ---- Turkiye icin ek kaynak: iptv-org toplayicisi -------------------
      # epgshare dokumu zaten Turkiye'yi kapsiyor; bu adimlar Turkce program
      # aciklamalarini zenginlestiriyor. Hepsi continue-on-error: biri
      # calismazsa is durmuyor, derleyici eldekiyle devam ediyor.
      - name: Toplayiciyi indir
        continue-on-error: true
        run: git clone --depth 1 -b master https://github.com/iptv-org/epg.git grabber

      - name: Bagimliliklari kur
        continue-on-error: true
        working-directory: grabber
        run: npm install

      - name: TV Plus
        continue-on-error: true
        timeout-minutes: 20
        working-directory: grabber
        run: npm run grab --- --sites=tvplus.com.tr --days=2 --maxConnections=5 --output=out/tvplus.xml

      - name: Digiturk
        continue-on-error: true
        timeout-minutes: 20
        working-directory: grabber
        run: npm run grab --- --sites=digiturk.com.tr --days=2 --maxConnections=5 --output=out/digiturk.xml

      
      # ---- derleme --------------------------------------------------------
      - name: Derle
        run: node derle.js

      - name: Dosyalar
        run: ls -lh out/

      - name: Yayinla
        run: |
          git config user.name "epg-bot"
          git config user.email "epg-bot@users.noreply.github.com"

          # Depoyu sismemek icin yalnizca .gz yayinlaniyor. Tek istisna
          # turkiye.xml: uygulamadaki eski adres ona bakiyor, kirilmasin.
          mv out/*.xml.gz out/index.json .
          [ -f out/turkiye.xml ] && mv out/turkiye.xml . || true
          rm -rf out onceki grabber

          git checkout --orphan guide-new
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f *.xml.gz index.json
          [ -f turkiye.xml ] && git add -f turkiye.xml || true
          git commit -m "EPG $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push -f origin guide-new:guide
