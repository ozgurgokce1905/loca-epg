name: Türkiye EPG

on:
  schedule:
    # Gunde iki kez: 04:30 ve 16:30 (TR saati)
    - cron: '30 1,13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Bir kaynak bugun cekilemezse dunku verisi ayakta kalsin.
      - name: Onceki rehberi al
        continue-on-error: true
        run: |
          git fetch origin guide --depth 1 || true
          if git show origin/guide:turkiye.xml > prev.xml 2>/dev/null; then
            echo "onceki rehber: $(grep -o '<programme ' prev.xml | wc -l) program"
          else
            rm -f prev.xml
            echo "onceki rehber yok"
          fi

      - name: Toplayiciyi indir
        run: git clone --depth 1 -b master https://github.com/iptv-org/epg.git grabber

      - name: Bagimliliklari kur
        working-directory: grabber
        run: npm install

      - name: TV Plus
        continue-on-error: true
        working-directory: grabber
        run: npm run grab --- --sites=tvplus.com.tr --days=2 --maxConnections=5 --output=out/tvplus.xml

      - name: Digiturk
        continue-on-error: true
        working-directory: grabber
        run: npm run grab --- --sites=digiturk.com.tr --days=2 --maxConnections=5 --output=out/digiturk.xml

      - name: Turksat Kablo
        continue-on-error: true
        working-directory: grabber
        run: npm run grab --- --sites=turksatkablo.com.tr --days=2 --maxConnections=5 --output=out/turksat.xml

      - name: D-Smart
        continue-on-error: true
        working-directory: grabber
        run: npm run grab --- --sites=dsmart.com.tr --days=2 --maxConnections=5 --output=out/dsmart.xml

      # Hangi kaynak bos dondu, log'a bakmadan gorunsun.
      - name: Kaynak ozeti
        run: |
          echo "| dosya | kanal | program |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          for f in grabber/out/*.xml; do
            [ -f "$f" ] || continue
            c=$(grep -o '<channel id' "$f" | wc -l)
            p=$(grep -o '<programme ' "$f" | wc -l)
            echo "| $(basename $f) | $c | $p |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Birlestir
        run: node merge.js grabber/out turkiye.xml prev.xml

      - name: Sikistir
        run: |
          gzip -9 -c turkiye.xml > turkiye.xml.gz
          ls -lh turkiye.xml turkiye.xml.gz
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Yayinlanan: $(grep -o '<channel id' turkiye.xml | wc -l) kanal, $(grep -o '<programme ' turkiye.xml | wc -l) program" >> $GITHUB_STEP_SUMMARY

      - name: Yayinla
        run: |
          git config user.name "epg-bot"
          git config user.email "epg-bot@users.noreply.github.com"
          git checkout --orphan guide-new
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f turkiye.xml turkiye.xml.gz
          git commit -m "EPG $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push -f origin guide-new:guide
